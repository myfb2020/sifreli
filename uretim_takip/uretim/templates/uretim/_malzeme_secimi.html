{# Suni deri tasarımda malzeme seçimi (örnek dokulu düğmeler). alan: form alanı, secili: seçili malzeme. #}
<div class="mal-izgara" data-alan="{{ alan }}">
  {% for k, ad, hex, grup in malzemeler %}<label class="mal" title="{{ ad }}" data-grup="{{ grup }}"><input type="radio" name="{{ alan }}" value="{{ k }}"{% if secili == k %} checked{% endif %}><span style="background-image:url('{% url 'parcali_malzeme' k %}')"></span>{{ ad }}</label>{% endfor %}
</div>
